name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          z=$(find . -iname "*PokerAI_Mini*.zip" -not -path "./.git/*" | head -n1)
          if [ -z "$z" ]; then z=$(find . -iname "*PokerAI*.zip" -not -path "./.git/*" | head -n1); fi
          if [ -z "$z" ]; then echo "PokerAI zip not found in repo"; find . -not -path "./.git/*" | head -50; exit 1; fi
          echo "Using $z"
          unzip -o "$z" -d .
          ls PokerAI
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: PokerAI
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PokerAI-apk
          path: PokerAI/app/build/outputs/apk/debug/app-debug.apk
